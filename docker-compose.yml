version: '3.9'

services:
  api-tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: api-automation-playwright:latest
    container_name: api_test_runner
    environment:
      - NODE_ENV=${NODE_ENV:-ci}
      - BASE_URL=${BASE_URL:-https://jsonplaceholder.typicode.com}
      - CI=true
      - ALLURE_RESULTS=${ALLURE_RESULTS:-false}
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./allure-results:/app/allure-results
      - ./reports:/app/reports
    command: ["--reporter=html,junit"]

  api-tests-smoke:
    extends:
      service: api-tests
    container_name: api_smoke_runner
    command: ["--project=smoke", "--reporter=list,junit"]

  api-tests-sanity:
    extends:
      service: api-tests
    container_name: api_sanity_runner
    command: ["--project=sanity", "--reporter=list,junit"]

  api-tests-integration:
    extends:
      service: api-tests
    container_name: api_integration_runner
    command: ["--project=integration", "--reporter=list,junit"]

  api-tests-regression:
    extends:
      service: api-tests
    container_name: api_regression_runner
    command: ["--project=regression", "--reporter=html,junit"]

  allure-report:
    image: frankescobar/allure-docker-service:latest
    container_name: allure_server
    ports:
      - "5050:5050"
    volumes:
      - ./allure-results:/app/allure-results
    environment:
      CHECK_RESULTS_EVERY_SECONDS: 3
      KEEP_HISTORY: 1
    profiles:
      - allure
